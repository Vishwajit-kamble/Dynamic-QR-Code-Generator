services:
  - type: web
    name: tapreview
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT backend.app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@tapreview.com
      - key: ADMIN_PASSWORD
        value: AdminTapReview2026!
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: PUBLIC_REDIRECT_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
